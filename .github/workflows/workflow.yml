
name: CI validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 nose
          python -m pip install "coverage<7"

      - name: Lint with flake8
        run: flake8 app tests

      - name: Run unit tests with nose
        run: |
          python -c "import collections, collections.abc; collections.Callable = collections.abc.Callable"
          nosetests -v
