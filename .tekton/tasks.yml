apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: alpine:3.20
      script: |
        #!/bin/sh
        set -eu
        find /workspace/source -mindepth 1 -maxdepth 1 -exec rm -rf {} +

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
spec:
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: main
  workspaces:
    - name: output
  steps:
    - name: clone
      image: alpine/git:2.45.2
      workingDir: $(workspaces.output.path)
      script: |
        #!/bin/sh
        set -eu
        git clone --branch "$(params.revision)" --depth 1 "$(params.url)" .

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: flake8
spec:
  workspaces:
    - name: source
  steps:
    - name: lint
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        pip install --no-cache-dir flake8
        flake8 app tests

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  workspaces:
    - name: source
  steps:
    - name: unit-tests
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        pip install --no-cache-dir nose
        PYTHONPATH=. nosetests -v

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildah
spec:
  params:
    - name: IMAGE
      type: string
  workspaces:
    - name: source
  steps:
    - name: build
      image: quay.io/buildah/stable:v1.36
      workingDir: $(workspaces.source.path)
      securityContext:
        privileged: true
      script: |
        #!/bin/sh
        set -eu
        buildah bud --storage-driver=vfs -t "$(params.IMAGE)" -f Containerfile .

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy
spec:
  params:
    - name: APP_NAME
      type: string
    - name: IMAGE
      type: string
  steps:
    - name: deploy
      image: registry.redhat.io/openshift4/ose-cli:latest
      script: |
        #!/bin/sh
        set -eu
        oc set image "deployment/$(params.APP_NAME)" "$(params.APP_NAME)=$(params.IMAGE)"
        oc rollout status "deployment/$(params.APP_NAME)" --timeout=180s
