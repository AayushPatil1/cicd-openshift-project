apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: guestbook-ci-cd
spec:
  params:
    - name: repo-url
      type: string
    - name: image
      type: string
    - name: app-name
      type: string
      default: guestbook
  workspaces:
    - name: shared-workspace
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: git-clone
      runAfter: [cleanup]
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: main
      workspaces:
        - name: output
          workspace: shared-workspace
    - name: flake8
      runAfter: [git-clone]
      taskRef:
        name: flake8
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: nose
      runAfter: [flake8]
      taskRef:
        name: nose
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: buildah
      runAfter: [nose]
      taskRef:
        name: buildah
      params:
        - name: IMAGE
          value: $(params.image)
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: deploy
      runAfter: [buildah]
      taskRef:
        name: deploy
      params:
        - name: APP_NAME
          value: $(params.app-name)
        - name: IMAGE
          value: $(params.image)
